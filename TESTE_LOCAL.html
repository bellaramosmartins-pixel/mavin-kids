async function api(endpoint,data){
 if(IS_LOCAL_FILE)return demoApi(endpoint,data);
 let res;
 try{res=await fetch('/api/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'});}
 catch{throw Error('Não foi possível alcançar o servidor. Confira se o jogo está hospedado e se a internet está funcionando.');}
 let json;try{json=await res.json()}catch{throw Error('O servidor do jogo não respondeu corretamente. Verifique se abriu o endereço do jogo online, e não o HTML solto.');}
 if(!res.ok)throw Error(json.error||'Não foi possível continuar.');return json;
}
async function checkRoom(code){
 if(IS_LOCAL_FILE)return true;
 let res;try{res=await fetch('/api/room?room='+encodeURIComponent(code),{cache:'no-store'});}catch{throw Error('Sem conexão com o servidor. Tente novamente.');}
 const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Esta sala não está disponível.');return data;
}
function setSession(role,room,token){state.role=role;state.room=room;state.token=token;if(!IS_LOCAL_FILE){sessionStorage.setItem('mavin-session',JSON.stringify({role,room,token}));history.replaceState({},'',location.pathname+'?room='+encodeURIComponent(room));}connect();}
function connect(){
 state.eventSource?.close();
 if(IS_LOCAL_FILE){demoUpdate();return;}
 const url=`/api/events?room=${encodeURIComponent(state.room)}&role=${state.role}&token=${encodeURIComponent(state.token)}`;
 const ev=new EventSource(url);state.eventSource=ev;
 ev.onmessage=e=>{try{const previousIndex=state.data?.questionIndex;state.data=JSON.parse(e.data);if(previousIndex!==state.data.questionIndex)state.showAnswers=false;state.offset=Date.now()-state.data.now;$('#dot').classList.add('live');$('#status').textContent='Conectado ao vivo';render();}catch(err){console.error(err);}};
 ev.onerror=()=>{$('#dot').classList.remove('live');$('#status').textContent='Reconectando...';state.connectionWarning='A conexão com o jogo caiu. Se não voltar, atualize a página.';render();};
}
function decorateIntro(){return `<div class="hero"><section class="panel hero-copy"><span class="eyebrow hero-kicker">✦ Uma aventura bíblica em tempo real</span><h1>O GRANDE <span class="accent">DESAFIO</span> BÍBLICO!</h1><p class="muted">Entre na aventura, monte seu personagem, responda pelo celular e descubra quem será o campeão do Mavin Kids!</p><div class="info"><div><strong>60s</strong><span>Alternativas</span></div><div><strong>30s</strong><span>V/F</span></div><div><strong>🏆</strong><span>Campeões</span></div></div><div class="row wrap"><button class="button big" data-act="create">🎤 Sou apresentadora</button><button class="button secondary big" data-act="joinScreen">📱 Sou jogador</button></div><p class="small muted" style="margin-top:20px;margin-bottom:0">Não precisa baixar aplicativo. Cada jogador usa o navegador do celular.</p>${IS_LOCAL_FILE?'<div class="banner" style="margin-top:14px">🧪 Esta é uma demonstração local. Você consegue criar sala e testar as telas neste aparelho, mas para reunir crianças de outros celulares é preciso publicar o projeto online.</div>':''}</section><section class="panel hero-art"><div class="stars">✦ ✧ ✦</div><div class="chest">🏆</div><div class="center"><h2>UMA MISSÃO. MUITAS DESCOBERTAS.</h2><span class="pill sun">MAVIN KIDS • ONLINE</span></div></section></div>`;}
function joinEntry(){return `<div class="panel join"><span class="eyebrow">🎮 Bem-vindo, explorador!</span><h2 style="margin-top:10px">Entre na aventura!</h2>${!state.joiningRoom?`<div class="banner"><strong>Peça o link do jogo para a apresentadora.</strong><p style="margin:8px 0 0">Ao abrir o link enviado por ela, você só precisa digitar seu nome e escolher seu avatar. Não é necessária senha nem código!</p></div><button class="button ghost block" data-act="home">← Voltar</button>`:`<p class="muted small">Você está entrando na sala <strong>${esc(state.joiningRoom)}</strong>. Não precisa de senha!</p><label class="input-label" for="nickname">Qual é o seu nome?</label><input id="nickname" class="input" maxlength="32" placeholder="Digite seu nome" autocomplete="given-name" autocapitalize="words" value="${esc(state.name)}"><div class="join-actions"><button class="button ghost" data-act="home">← Voltar</button><button class="button" data-act="startAvatar">Personalizar meu avatar →</button></div>`}</div>`;}
function avatarEditor(){const a=state.avatar;const part=state.part;return `<div class="avatar-editor"><div class="avatar-display">${avatarSvg(a)}<div class="avatar-label"><span class="eyebrow">Seu personagem</span><div class="avatar-editor-title">${esc(state.name||'Seu avatar')}</div><p class="small muted" style="margin-bottom:0">Do seu jeitinho! 💜</p></div></div><div class="avatar-parts"><div class="part-tabs">${Object.keys(LABELS).map(k=>`<button class="part-tab ${k===part?'active':''}" data-act="part" data-part="${k}"><span>${ICONS[k]}</span>${LABELS[k]}</button>`).join('')}</div><div class="choice-grid">${AV_CHOICES[part].map((v,i)=>`<button class="swatch-button ${a[part]===i?'active':''}" data-act="selectAvatar" data-part="${part}" data-value="${i}" aria-label="${LABELS[part]} ${v}">${COLORS[part]?`<span class="swatch-color" style="background:${COLORS[part][i]}"></span>`:`<span style="font-size:23px">${part==='hair'?['✂️','🌀','💇','〰️','🎀','👩','⚡','🌊'][i]:part==='eyes'?['👀','◉','😊','🤨','😉'][i]:part==='mouth'?['🙂','😆','😌','😮'][i]:['×','👓','🎀','🧢','👑','🎧','⭐','💝'][i]}</span>`}<span>${v}</span></button>`).join('')}</div><button class="button ghost block" style="margin-top:13px" data-act="randomAvatar">🎲 Surpreenda-me!</button></div></div>`;}
function avatarScreen(){return `<div class="panel join" style="max-width:790px"><span class="eyebrow">⭐ ETAPA 2 • PREPARE-SE!</span><h2 style="margin-top:8px">Monte seu personagem</h2><p class="small muted">Escolha o cabelo, as cores, a roupa e os acessórios. Você aparece assim no placar!</p>${avatarEditor()}<div class="join-actions"><button class="button ghost" data-act="joinScreen">← Voltar</button><button class="button big" data-act="joinGame" ${state.loading?'disabled':''}>${state.loading?'Entrando...':'Pronto! Entrar na sala →'}</button></div></div>`;}
function hostLobby(d){const link=location.origin+location.pathname+'?entrar=1&room='+encodeURIComponent(d.code);return `<span class="eyebrow">🎤 PAINEL DA APRESENTADORA</span><h2 style="margin-top:10px">Sala pronta! 🎉</h2><p class="muted">Envie o link para as famílias. As crianças só precisam colocar o nome e personalizar o avatar. Você decide quando começar.</p><div class="inset center"><div class="small bold muted">SALA • ENVIE O LINK ABAIXO</div><div class="room-code">${d.code}</div>${IS_LOCAL_FILE?`<div class="banner" style="margin-top:15px">🔬 <strong>Modo de demonstração.</strong> Você pode simular uma criança neste navegador, mas este arquivo sozinho não conecta outros celulares.</div><button class="button secondary" data-act="demoChild">👧 Testar como criança</button>`:`<button class="button ghost" data-act="copy" data-value="${esc(link)}">🔗 Copiar link para as crianças</button><span class="url-info">${esc(link)}</span>`}</div><div class="game-meta"><span class="pill">👧 ${d.participants} participantes</span><span class="pill">🔒 Respostas privadas</span><span class="pill">⏱️ 60s / 30s</span></div><div class="banner">💜 <strong>Começa com um único PLAY!</strong> O jogo troca as perguntas automaticamente quando o tempo termina. As alternativas só aparecem na tela das crianças após você iniciar.</div><button class="button big block" data-act="play" ${d.participants===0?'disabled':''}>▶ PLAY • COMEÇAR O DESAFIO</button><div class="center-note">Quando começar, as crianças acompanham tudo pelo próprio celular.</div>`;}
function questionHTML(d,host=false){const q=d.question;if(!q)return `<div class="notice">Preparando a próxima missão...</div>`;const active=d.phase==='active',revealed=d.phase==='revealed',picked=d.me?.answered,ans=active||revealed;const opts=q.choices.map((option,i)=>{const selected=!host && picked===i;const cl= revealed && q.correct===i?'correct':revealed&&selected?'wrong':selected?'selected':'';return `<button class="option ${cl}" ${host||!active||picked!==null?'disabled':''} data-act="answer" data-choice="${i}"><span class="opt-letter">${q.kind==='tf'?(i===0?'V':'F'):String.fromCharCode(65+i)}</span><span>${esc(option)}</span>${revealed&&i===q.correct?'<span style="margin-left:auto">✔</span>':''}</button>`;}).join('');
return `<div class="eyebrow">${esc(d.missions[q.mission].icon)} ${esc(d.missions[q.mission].name)}</div><h2 style="margin-top:11px">Questão ${d.questionIndex+1} <span class="muted">/ ${d.total}</span></h2><div class="total-progress"><div style="width:${100*(d.questionIndex+1)/d.total}%"></div></div><div class="game-meta"><span class="pill sun">⭐ ${q.points} pontos</span><span class="pill">${q.kind==='tf'?'Verdadeiro ou falso':'Múltipla escolha'}</span><span class="pill">${q.kind==='tf'?'30':'60'} segundos</span></div><div class="question-box"><div class="question-emoji">${esc(q.emoji)}</div><div class="question-text">${esc(q.text)}</div></div><div class="option-grid">${opts}</div><div class="count-wrap"><div class="clock" id="clock"><div class="inner" id="timeleft">--</div></div><div class="answer-progress"><strong id="phase-label">${revealed?'Próxima pergunta em...':host?'Respostas chegando...':picked!==null?'✅ Resposta enviada!':'Sua vez de responder!'}</strong><div class="small muted" id="answer-count">${d.answeredCount} de ${d.participants} responderam</div><div class="progress"><div style="width:${d.participants?Math.round(100*d.answeredCount/d.participants):0}%"></div></div></div></div>${revealed?`<div class="feedback"><strong>✅ Resposta correta: ${esc(q.choices[q.correct])}</strong><div class="small">${esc(q.detail)} • ${esc(q.reference)}</div>${!host?`<div style="margin-top:7px;font-weight:900">${d.me?.wasCorrect?'🎉 Você acertou! +'+q.points+' pontos':'💜 Vamos para a próxima!'}</div>`:''}</div>`:''}${!host&&active&&picked!==null?'<div class="banner">Resposta recebida! Pode acompanhar a contagem regressiva. ⏳</div>':''}`;}

const DEMO_MISSIONS = [
  {name:'Portal dos Emojis',icon:'🧩',subtitle:'Decifre histórias bíblicas',time:60,points:10},
  {name:'Caça às Pistas',icon:'🔎',subtitle:'Descubra o objeto da história',time:60,points:10},
  {name:'Baús Misteriosos',icon:'🎁',subtitle:'Verdadeiro ou falso?',time:30,points:10},
  {name:'O Grande Enigma',icon:'🗝️',subtitle:'Quem é esse personagem?',time:60,points:15}
];
function demoSerialize(){
 const room=demoRoom;if(!room)return null;
 const q=DEMO_QUESTIONS[room.index],host=state.role==='host',showCorrect=['revealed','finished'].includes(room.phase);
 const player=room.players.find(p=>p.token===state.token);
 const ranking=room.players.map(p=>({id:p.id,name:p.name,avatar:p.avatar,score:p.score,answered:p.answers[room.index]!==undefined,selected:host?(p.answers[room.index]??null):null})).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'pt-BR'));
 let lastScore=null,rank=0;ranking.forEach((p,i)=>{if(lastScore!==p.score){rank=i+1;lastScore=p.score;}p.rank=rank;});
 const high=ranking.length?ranking[0].score:null;
 return {code:room.code,phase:room.phase,questionIndex:room.index,total:DEMO_QUESTIONS.length,missions:DEMO_MISSIONS,now:Date.now(),deadline:room.deadline,question:q?{mission:q.mission,kind:q.kind,emoji:q.emoji,text:q.text,choices:q.choices,points:DEMO_MISSIONS[q.mission].points,reference:showCorrect||host?q.ref:null,detail:showCorrect||host?q.detail:null,...((showCorrect||host)?{correct:q.correct}:{})}:null,participants:ranking.length,answeredCount:room.players.filter(p=>p.answers[room.index]!==undefined).length,ranking:host?ranking:(showCorrect||['lobby','finished'].includes(room.phase)?ranking.map(({selected,...p})=>p):ranking.map(p=>({id:p.id,name:p.name,avatar:p.avatar,answered:p.answered}))),champions:room.phase==='finished'?ranking.filter(p=>p.score===high):[],me:player?{id:player.id,name:player.name,avatar:player.avatar,score:player.score,answered:player.answers[room.index]??null,wasCorrect:showCorrect&&player.answers[room.index]===q.correct}:null,host,seconds:q?(q.kind==='tf'?30:60):60,revealSeconds:5};
}
function demoUpdate(){if(!IS_LOCAL_FILE)return;state.data=demoSerialize();state.offset=0;if($('#dot'))$('#dot').classList.add('live');if($('#status'))$('#status').textContent='Modo teste';render();}
function demoNotify(){if(state.role)demoUpdate();}
function demoStart(){if(!demoRoom)return;demoRoom.phase='active';let q=DEMO_QUESTIONS[demoRoom.index];let duration=q.kind==='tf'?30:60;if(location.search.includes('rapido=1'))duration=2;demoRoom.deadline=Date.now()+duration*1000;demoNotify();demoRoom.timer=setTimeout(demoReveal,duration*1000);}
function demoReveal(){if(!demoRoom||demoRoom.phase!=='active')return;const q=DEMO_QUESTIONS[demoRoom.index];for(const p of demoRoom.players){if(p.answers[demoRoom.index]===q.correct)p.score+=DEMO_MISSIONS[q.mission].points;}demoRoom.phase='revealed';let duration=location.search.includes('rapido=1')?1:5;demoRoom.deadline=Date.now()+duration*1000;demoNotify();demoRoom.timer=setTimeout(()=>{if(demoRoom.index===DEMO_QUESTIONS.length-1){demoRoom.phase='finished';demoRoom.deadline=0;demoNotify();}else{demoRoom.index++;demoStart();}},duration*1000);}
async function demoApi(endpoint,data){
 if(endpoint==='create'){if(demoRoom?.timer)clearTimeout(demoRoom.timer);demoRoom={code:'123456',players:[],phase:'lobby',index:0,deadline:0,timer:null};demoHostToken='apresentadora';demoLastPlayerToken='';return {code:demoRoom.code,token:demoHostToken};}
 if(!demoRoom||String(data.room)!==demoRoom.code)throw Error('Sala de teste não encontrada. Crie a sala como apresentadora.');
 if(endpoint==='join'){if(demoRoom.phase==='finished')throw Error('Esta partida já acabou.');let name=String(data.name||'').trim();if(demoRoom.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))throw Error('Este nome já foi usado. Coloque uma inicial para diferenciar.');const token='crianca-'+(demoRoom.players.length+1);demoRoom.players.push({token,id:token,name,avatar:{...data.avatar},score:0,answers:{}});demoLastPlayerToken=token;return {token,name};}
 if(endpoint==='host'){if(data.token!==demoHostToken)throw Error('Apenas a apresentadora pode começar.');if(data.action==='play'){if(!demoRoom.players.length)throw Error('Cadastre pelo menos uma criança de teste.');if(demoRoom.phase!=='lobby')throw Error('A partida já começou.');demoStart();return {ok:true};}if(data.action==='reset'){clearTimeout(demoRoom.timer);demoRoom.phase='lobby';demoRoom.index=0;demoRoom.deadline=0;for(const p of demoRoom.players){p.score=0;p.answers={};}demoNotify();return {ok:true};}}
 if(endpoint==='avatar'){const p=demoRoom.players.find(p=>p.token===data.token);if(!p)throw Error('Criança não encontrada.');p.avatar={...data.avatar};return {ok:true};}
 if(endpoint==='answer'){const p=demoRoom.players.find(p=>p.token===data.token);if(!p)throw Error('Criança não encontrada.');if(demoRoom.phase!=='active'||Date.now()>=demoRoom.deadline)throw Error('O tempo terminou.');if(p.answers[demoRoom.index]!==undefined)throw Error('Você já respondeu!');p.answers[demoRoom.index]=data.choice;demoNotify();return {ok:true};}
 throw Error('Ação não disponível no teste.');
}

function render(){const app=$('#app');if(!app)return;let html;if(!state.role){html=state.screen==='join'?joinEntry():state.screen==='avatar'?avatarScreen():decorateIntro();}else if(!state.data)html='<div class="panel join center"><div class="waiting-art">📡</div><h2>Conectando à sala...</h2><p class="muted">'+esc(state.connectionWarning||'Verificando sua conexão.')+'</p><button class="button ghost" data-act="logout">Voltar ao começo</button></div>';else if(state.screen==='editAvatar'&&state.data.phase==='lobby')html=playerAvatarEdit();else html=state.role==='host'?hostPage(state.data):playerPage(state.data);app.innerHTML=html;
 const bar=$('#demo-toolbar');if(bar)bar.innerHTML=IS_LOCAL_FILE?`<div class="demo-banner"><span>🧪 <strong>TESTE LOCAL</strong> — esta prévia funciona neste navegador, mas não conecta celulares de outras casas.</span><span class="demo-tools">${demoRoom?`<button class="button ghost" data-act="demoHost">🎤 Ver apresentadora</button>${demoLastPlayerToken?`<button class="button secondary" data-act="demoPlayer">👧 Ver criança</button>`:''}<button class="button ghost" data-act="demoChild">＋ Outra criança</button>`:''}</span></div>`:'';
 updateClock();}
function updateClock(){const d=state.data;if(!d||!['active','revealed'].includes(d.phase))return;const left=Math.max(0,Math.ceil((d.deadline-(Date.now()-state.offset))/1000));const el=$('#timeleft');if(el)el.textContent=String(left).padStart(2,'0');const ring=$('#clock');if(ring){const dur=d.phase==='revealed'?d.revealSeconds:d.seconds;ring.style.setProperty('--pct',Math.min(100,Math.max(0,left/dur*100)));ring.classList.toggle('urgent',left<=10);}}
async function act(action,el){try{switch(action){
case 'home':state.screen='home';render();break;
case 'demoHost':if(demoRoom){state.role='host';state.room=demoRoom.code;state.token=demoHostToken;state.screen='game';demoUpdate();}break;
case 'demoPlayer':if(demoRoom&&demoLastPlayerToken){state.role='player';state.room=demoRoom.code;state.token=demoLastPlayerToken;state.screen='game';demoUpdate();}break;
case 'demoChild':if(demoRoom){state.role='';state.data=null;state.name='';state.token='';state.room='';state.joiningRoom=demoRoom.code;state.screen='join';render();}break;
case 'joinScreen':state.screen='join';render();break;
case 'startAvatar':{const room=state.joiningRoom,name=$('#nickname')?.value.trim();if(!/^\d{6}$/.test(room))throw Error('Você precisa abrir o link enviado pela apresentadora.');if(!name||name.length<2)throw Error('Digite seu nome (pelo menos 2 letras).');await checkRoom(room);state.name=name;state.screen='avatar';render();break;}
case 'part':state.part=el.dataset.part;render();break;
case 'selectAvatar':state.avatar[el.dataset.part]=Number(el.dataset.value);render();break;
case 'randomAvatar':state.avatar=randAvatar();render();break;
case 'create':{if(state.loading)return;state.loading=true;const r=await api('create',{});state.loading=false;setSession('host',r.code,r.token);toast('Sala criada! Compartilhe o link com as famílias.');render();break;}
case 'joinGame':{if(state.loading)return;state.loading=true;const r=await api('join',{room:state.joiningRoom,name:state.name,avatar:state.avatar});state.loading=false;setSession('player',state.joiningRoom,r.token);toast('Bem-vindo(a) ao Mavin Kids!');render();break;}
case 'play':await api('host',{room:state.room,token:state.token,action:'play'});toast('Valendo! Boa aventura!');break;
case 'answer':{const i=Number(el.dataset.choice);const r=await api('answer',{room:state.room,token:state.token,choice:i});toast('✅ Resposta enviada!');break;}
case 'toggleAnswers':state.showAnswers=!state.showAnswers;render();break;
case 'copy':{const v=el.dataset.value;try{await navigator.clipboard.writeText(v);toast('Link copiado!');}catch{toast('Copie o link que aparece acima.');}break;}
case 'editLobbyAvatar':state.avatar={...state.data.me.avatar};state.screen='editAvatar';render();break;
case 'cancelAvatarEdit':state.screen='game';render();break;
case 'saveAvatar':await api('avatar',{room:state.room,token:state.token,avatar:state.avatar});state.screen='game';toast('Avatar atualizado!');render();break;
case 'reset':if(confirm('Recomeçar a partida e zerar a pontuação de todas as crianças?')){await api('host',{room:state.room,token:state.token,action:'reset'});toast('Nova aventura pronta!');}break;
case 'logout':state.eventSource?.close();state.role='';state.token='';state.room='';state.data=null;state.screen='join';sessionStorage.removeItem('mavin-session');render();break;
}}catch(err){state.loading=false;toast(err.message||'Não foi possível concluir.');render();}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&state.screen==='join'&&!state.role)act('startAvatar');});
setInterval(updateClock,170);
try{const ss=JSON.parse(sessionStorage.getItem('mavin-session')||'null');const roomParam=new URLSearchParams(location.search).get('room');if(!IS_LOCAL_FILE && !CHILD_LINK && ss?.role && ss?.room && ss?.token && (!roomParam||roomParam===ss.room)){state.screen='game';setSession(ss.role,ss.room,ss.token);}else if(roomParam){state.screen='join';}}catch{}
render();

</script></body></html>
